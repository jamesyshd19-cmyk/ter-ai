# Build terai-router and publish it with PyPI Trusted Publishing (no API token stored in GitHub).
# Manual run: Actions -> Publish to PyPI -> Run workflow -> choose testpypi or pypi.
# Manual only until the PyPI and TestPyPI trusted publishers are set up.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "testpypi or pypi"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: | 
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
      - name: Drop the git-only Wayu dependency (PyPI rejects direct URL dependencies)
        run: sed -i '/wayu-tts @ git+/d' pyproject.toml
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
